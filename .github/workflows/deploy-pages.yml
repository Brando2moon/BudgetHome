name: Deploy Camille's Finance to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/src _site/assets
          cp index.html refresh.html styles.css reference-theme.css paycheck-4k-theme.css animation-v9.css app.js animation-v9.js app-source-*.txt service-worker.js manifest.webmanifest _site/
          cp src/budgetEngine.js src/animationEngine.js _site/src/
          cp assets/approved-bank-reference-4k-*.txt _site/assets/
          cp assets/exact-approved-v8-*.txt _site/assets/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
